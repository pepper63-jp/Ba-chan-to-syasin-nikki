<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#d87093">
    <title>ばあちゃんと写真日記 </title>
    <link rel="icon" href="favicon.ico?v=dc77ef4d693100b2" type="image/x-icon">
    <link rel="apple-touch-icon" href="icon-192.png?v=dc77ef4d693100b2">
    <link rel="manifest" href="manifest.webmanifest?v=dc77ef4d693100b2">
    <link rel="stylesheet" href="style.css?v=dc77ef4d693100b2">

  </head>
    
  <body>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<div id="loading-overlay" class="loading-overlay">
    <div class="spinner"></div>
    <p id="loading-text">写真をおくっています...</p>
</div>

<div class="app-wrapper">
    <h1 class="main-title">📸 ばあちゃんと写真日記 🌸</h1>
    <p id="user-status" class="user-status-text"></p>

    <div class="calendar-container">
        <div class="calendar">
            <div class="calendar-header">
                <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
                <div id="calendar-title"></div>
                <button class="nav-btn" onclick="changeMonth(1)">▶</button>
            </div>
            <div class="days-grid">
                <div class="day-name sun">日</div><div class="day-name">月</div><div class="day-name">火</div>
                <div class="day-name">水</div><div class="day-name">木</div><div class="day-name">金</div><div class="day-name sat">土</div>
            </div>
            <div id="calendar-dates" class="days-grid"></div>
        </div>
        <div class="upload-area">
            <input type="file" id="photo-input" accept="image/*" multiple style="display: none;">
            <button type="button" class="main-button settings-main-btn" id="settings-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="settings-menu-modal" title="設定">
                <span class="settings-main-btn-inner">
                    <svg class="settings-gear-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" focusable="false">
                        <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                    </svg>
                    <span class="settings-main-btn-label">設定</span>
                </span>
            </button>
        </div>
    </div>
</div>

<div id="zoom-modal" class="zoom-overlay">
    <img id="zoomed-img" src="" alt="拡大画像">

    <div class="nav-container">
        <button class="nav-arrow prev" onclick="goPrev()">◀ 前へ</button>
        <button class="nav-arrow next" onclick="goNext()">次へ ▶</button>
    </div>

    <div class="swipe-hint">◀ 左右にスライド、またはボタンでめくれます ▶</div>
    <div style="width: 100%; padding: 20px; box-sizing: border-box;">
        <button class="standard-btn back-btn" onclick="closeModal('zoom-modal')">もどる</button>
    </div>
</div>

<div id="settings-menu-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-menu-title">
    <div class="modal-content">
        <h3 id="settings-menu-title">設定</h3>
        <button type="button" class="standard-btn save-btn" id="settings-open-sender">👤 投稿者の設定を変える</button>
        <button type="button" class="standard-btn back-btn" id="settings-logout-btn" style="display: none;">ログアウト</button>
        <button type="button" class="standard-btn back-btn" id="settings-menu-back-btn">もどる</button>
    </div>
</div>

<div id="sender-modal" class="modal">
    <div class="modal-content">
        <h3>だれが投稿しますか？</h3>
        <div class="emoji-selection" id="emoji-list"></div>
        <input type="text" id="user-name-input" placeholder="おなまえ" class="name-input">
        <button class="standard-btn save-btn" onclick="saveCustomUser()">決定！</button>
        <button class="standard-btn back-btn" onclick="closeModal('sender-modal')">もどる</button>
    </div>
</div>

<div id="empty-day-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="empty-day-modal-title">
    <div class="modal-content">
        <h2 id="empty-day-modal-title"></h2>
        <button type="button" class="standard-btn add-photo-btn" id="empty-day-upload-btn">📸写真をのせる</button>
        <button type="button" class="standard-btn back-btn" id="empty-day-back-btn">もどる</button>
    </div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <h2 id="modal-date-title"></h2>
        <button class="standard-btn add-photo-btn" id="modal-add-btn">📸 写真を追加する</button>
        <div id="modal-photo-list" class="photo-grid-view"></div>
        <button class="standard-btn back-btn" onclick="closeModal('modal')">もどる</button>
    </div>
</div>

    <script  src="./script.js?v=dc77ef4d693100b2"></script>

  </body>
  
</html>
